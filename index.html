<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHINO DATABANK</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center;padding:15px} .card{background:#1f1f1f;padding:20px;border-radius:20px;margin:15px 0;border:2px solid #FFD700} input,select,button{width:95%;padding:16px;margin:8px 0;border-radius:12px;font-size:16px} button{background:#FFD700;color:#000;font-weight:900;border:none} .bal{font-size:50px;color:#FFD700;font-weight:900}</style></head><body><h1>🦏 RHINO DATABANK</h1><p>Save Data Forever - MTN / Airtel Uganda</p><div class="card"><h3>Enter Bank</h3><input id="phone" placeholder="Phone 077xxxxxxx"><input id="name" placeholder="Name"><select id="telecom"><option>MTN</option><option>AIRTEL</option></select><button onclick="login()">ENTER RHINO BANK</button></div><div class="card" id="bank" style="display:none"><div class="bal" id="bal">0 MB</div><p>Saved Forever - Never Expires!</p><input id="amt" type="number" placeholder="500"><button onclick="deposit()">💰 SAVE DATA</button><button onclick="withdraw()" style="background:#ff3333;color:white">📤 WITHDRAW</button><div id="hist" style="text-align:left"></div></div><script>const supabase=window.supabase.createClient('https://zlmaacasqccbmqksqfwu.supabase.co','sb_publishable_5rY71dluT4x_UcigGnfhnw_Pa8hdVDa');let wallet=null,profile=null;async function login(){const ph=document.getElementById('phone').value,n=document.getElementById('name').value,tc=document.getElementById('telecom').value;if(!ph)return alert('Phone!');let {data:p}=await supabase.from('profiles').select('*').eq('phone_number',ph);if(!p||!p.length){let {data,error}=await supabase.from('profiles').insert({phone_number:ph,full_name:n,telecom:tc}).select();if(error)return alert(error.message);profile=data[0]}else profile=p[0];let {data:w}=await supabase.from('wallets').select('*').eq('user_id',profile.id);if(!w||!w.length){let {data}=await supabase.from('wallets').insert({user_id:profile.id,balance_mb:0}).select();wallet=data[0]}else wallet=w[0];document.getElementById('bank').style.display='block';load() }async function load(){let {data}=await supabase.from('wallets').select('*').eq('id',wallet.id).single();wallet=data;document.getElementById('bal').innerText=data.balance_mb+' MB';let {data:d}=await supabase.from('deposits').select('*').eq('wallet_id',wallet.id).order('created_at',{ascending:false}).limit(5);let h='<h4>History</h4>';d?.forEach(x=>h+=`<p>✅ ${x.amount_mb} MB saved</p>`);document.getElementById('hist').innerHTML=h}async function deposit(){let a=parseFloat(document.getElementById('amt').value);if(!a)return alert('Amount');await supabase.from('deposits').insert({wallet_id:wallet.id,amount_mb:a});await supabase.from('wallets').update({balance_mb:wallet.balance_mb+a}).eq('id',wallet.id);load();alert('Saved '+a+' MB forever!')}async function withdraw(){let a=parseFloat(document.getElementById('amt').value);if(!a||a>wallet.balance_mb)return alert('Low balance');await supabase.from('wallets').update({balance_mb:wallet.balance_mb-a}).eq('id',wallet.id);load();alert('Withdrawn '+a+' MB!')} </script></body></html>
