<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhino Data Bank - Ver: 0.2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.google-card{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- HEADER -->
<header class="bg-black text-white p-4 flex justify-between items-center sticky top-0 z-50">
  <h1 class="font-bold text-xl">🦏 Rhino Data Bank <span class="text-yellow-400">Ver: 0.2</span></h1>
  <button onclick="openGoogleLogin()" class="bg-white text-black px-4 py-1 rounded-full text-sm font-bold">Sign in</button>
</header>

<!-- HOME ONLY RATING -->
<section class="p-4">
  <div class="bg-white rounded-xl p-4 shadow flex justify-between items-center">
    <div><p class="font-bold">Rate Us</p><p class="text-xs text-gray-500">Only shown on Home • Ver: 0.2</p></div>
    <div class="text-yellow-400"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="far fa-star"></i></div>
  </div>
</section>

<!-- BUNDLES -->
<section class="p-4 grid grid-cols-2 gap-3">
  <div class="bg-white rounded-xl p-4 shadow text-center">
    <h3 class="font-bold">1GB Daily</h3><p class="text-green-600 font-bold">UGX 5,000</p>
    <button onclick="buyBundle('1GB Daily','5000')" class="mt-2 bg-black text-white w-full py-2 rounded-lg text-sm">Buy Now</button>
  </div>
  <div class="bg-white rounded-xl p-4 shadow text-center">
    <h3 class="font-bold">5GB Weekly</h3><p class="text-green-600 font-bold">UGX 15,000</p>
    <button onclick="buyBundle('5GB Weekly','15000')" class="mt-2 bg-black text-white w-full py-2 rounded-lg text-sm">Buy Now</button>
  </div>
  <div class="bg-white rounded-xl p-4 shadow text-center">
    <h3 class="font-bold">20GB Monthly</h3><p class="text-green-600 font-bold">UGX 45,000</p>
    <button onclick="buyBundle('20GB Monthly','45000')" class="mt-2 bg-black text-white w-full py-2 rounded-lg text-sm">Buy Now</button>
  </div>
  <div class="bg-white rounded-xl p-4 shadow text-center">
    <h3 class="font-bold">Convert MOMO</h3><p class="text-blue-600 font-bold">Instant</p>
    <button onclick="buyBundle('MOMO Convert','1000')" class="mt-2 bg-blue-600 text-white w-full py-2 rounded-lg text-sm">Convert</button>
  </div>
</section>

<div id="payStatus" class="text-center text-sm font-bold text-blue-600 p-2"></div>

<!-- GOOGLE POPUP MODAL - YOU LOVED THIS -->
<div id="googleModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[99] p-4">
  <div class="google-card bg-white w-full max-w-[360px] rounded-2xl p-6">
    <div class="flex justify-center mb-4"><img src="https://www.google.com/images/branding/product/ico/googleg_lodp.ico" class="w-8"></div>
    <h2 class="text-xl text-center">Sign in</h2>
    <p class="text-center text-sm text-gray-600 mb-4">to continue to Rhino Data Bank</p>
    
    <div id="step1">
      <input id="gEmail" type="email" placeholder="Email or phone" class="w-full border border-gray-400 rounded p-3 text-sm">
      <div class="flex justify-end gap-3 mt-6">
        <button onclick="closeGoogleLogin()" class="text-sm text-gray-600">Cancel</button>
        <button onclick="googleNext()" class="bg-blue-600 text-white px-6 py-2 rounded text-sm">Next</button>
      </div>
    </div>

    <div id="step2" class="hidden">
      <p id="showEmail" class="text-sm border rounded-full px-3 py-1 inline-block mb-3"></p>
      <input id="gName" type="text" placeholder="Full Name" class="w-full border border-gray-400 rounded p-3 text-sm mb-3">
      <input id="gPhone" type="tel" placeholder="MTN Number 078..." class="w-full border border-gray-400 rounded p-3 text-sm">
      <div class="flex justify-end gap-3 mt-6">
        <button onclick="backStep()" class="text-sm text-gray-600">Back</button>
        <button onclick="finishGoogleLogin()" class="bg-blue-600 text-white px-6 py-2 rounded text-sm">Continue</button>
      </div>
    </div>
  </div>
</div>

<!-- MOMO MODAL -->
<div id="momoModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[90] p-4">
  <div class="bg-white w-full max-w-sm rounded-2xl p-5">
    <h3 class="font-bold text-lg">Pay with MTN MoMo</h3>
    <p id="bundleInfo" class="text-sm text-gray-500 mb-3"></p>
    <input id="momoPhone" type="tel" placeholder="078... / 2567..." class="w-full border rounded p-3 mb-3">
    <input id="momoAmount" type="text" readonly class="w-full border rounded p-3 mb-3 bg-gray-100 font-bold">
    <div id="momoJsonBox" class="bg-gray-900 text-green-300 text-[10px] p-2 rounded mb-3 overflow-auto max-h-32"></div>
    <button onclick="confirmMomoPay()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-xl">Confirm Pay - Sandbox 202</button>
    <button onclick="closeMomo()" class="w-full mt-2 text-sm text-gray-500">Cancel</button>
  </div>
</div>

<script>
// ========= CONFIG - PUT YOUR 3 KEYS HERE BRO =========
const MOMO = {
  SUBSCRIPTION_KEY: "REPLACE_WITH_YOUR_PRIMARY_KEY",
  API_USER_ID: "REPLACE_WITH_YOUR_API_USER_UUID",
  API_KEY: "REPLACE_WITH_YOUR_API_KEY",
  ENV: "sandbox",
  CURRENCY: "UGX",
  TEST_MSISDN: "46733123454" // MTN sandbox number - change to real later
};

let currentBundle = { name: "", amount: "" };
let userData = JSON.parse(localStorage.getItem('rhino_user')||'null');

// GOOGLE LOGIN LOGIC
function openGoogleLogin(){ document.getElementById('googleModal').classList.remove('hidden'); document.getElementById('googleModal').classList.add('flex'); }
function closeGoogleLogin(){ document.getElementById('googleModal').classList.add('hidden'); }
function googleNext(){
  let email = document.getElementById('gEmail').value;
  if(!email) return alert('Enter email');
  document.getElementById('showEmail').innerText = email;
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('step2').classList.remove('hidden');
}
function backStep(){ document.getElementById('step2').classList.add('hidden'); document.getElementById('step1').classList.remove('hidden'); }
function finishGoogleLogin(){
  let name = document.getElementById('gName').value;
  let phone = document.getElementById('gPhone').value;
  let email = document.getElementById('gEmail').value;
  if(!name||!phone) return alert('Fill name and phone');
  userData = { email, name, phone };
  localStorage.setItem('rhino_user', JSON.stringify(userData));
  closeGoogleLogin();
  alert('Welcome '+name+' - Ver: 0.2 active!');
}

// BUY LOGIC
function buyBundle(name, amount){
  currentBundle = { name, amount };
  document.getElementById('bundleInfo').innerText = name + " - UGX " + amount;
  document.getElementById('momoAmount').value = "UGX " + amount;
  document.getElementById('momoPhone').value = userData ? userData.phone : "";
  
  // Build exact JSON to paste in MTN portal if browser CORS blocks
  let externalId = "RHINO" + Date.now();
  let referenceId = crypto.randomUUID();
  let payload = {
    amount: amount,
    currency: MOMO.CURRENCY,
    externalId: externalId,
    payer: { partyIdType: "MSISDN", partyId: MOMO.TEST_MSISDN },
    payerMessage: "Rhino "+name,
    payeeNote: "Thanks"
  };
  document.getElementById('momoJsonBox').innerText = "X-Reference-Id: "+referenceId+"\nX-Target-Environment: sandbox\n\n"+JSON.stringify(payload, null, 2);
  
  window._lastMomo = { referenceId, payload, externalId };
  document.getElementById('momoModal').classList.remove('hidden');
  document.getElementById('momoModal').classList.add('flex');
}
function closeMomo(){ document.getElementById('momoModal').classList.add('hidden'); }

async function confirmMomoPay(){
  let phoneInput = document.getElementById('momoPhone').value;
  if(!phoneInput) return alert('Enter MoMo number');
  
  document.getElementById('payStatus').innerText = "Sending RequestToPay... Waiting for 202 Accepted";
  
  // In sandbox, direct browser call will be blocked by CORS - so we show 202 simulation
  // For REAL live you need tiny backend / Vercel function
  // But for now we do manual copy method
  
  console.log("COPY THIS TO MTN PORTAL TRY IT:", window._lastMomo);
  
  // Try real fetch with CORS proxy
  try{
    let res = await fetch("https://proxy.corsfix.com/?https://sandbox.momodeveloper.mtn.com/collection/v1_0/requesttopay",{
      method:"POST",
      headers:{
        "X-Reference-Id": window._lastMomo.referenceId,
        "X-Target-Environment": "sandbox",
        "Ocp-Apim-Subscription-Key": MOMO.SUBSCRIPTION_KEY,
        "Content-Type":"application/json"
      },
      body: JSON.stringify(window._lastMomo.payload)
    });
    if(res.status===202){
      document.getElementById('payStatus').innerText = "✅ 202 Accepted - Check MTN Dashboard!";
      alert("✅ 202 Accepted! Payment sent to sandbox number "+MOMO.TEST_MSISDN);
      closeMomo();
    }else{
      let t = await res.text();
      document.getElementById('payStatus').innerText = "Response: "+res.status+" "+t+" - Use manual copy box";
    }
  }catch(e){
    document.getElementById('payStatus').innerText = "CORS blocked (normal in sandbox) - COPY the black box JSON and paste in MTN portal Try It to get 202";
    alert("Bro, browser blocks MTN CORS. Do this: COPY the JSON in black box inside MoMo modal and PASTE it in your MTN portal screenshot page -> click Send -> you will get 202 Accepted. That's sandbox success!");
  }
}
</script>

<footer class="text-center text-[10px] text-gray-400 p-4">Rhino Data Bank Ver: 0.2 • MTN Sandbox Integrated • 2026</footer>
</body>
</html>
